[project]
name = "shtab-notes"
version = "0.1.1"
description = "Заметки Shtab"
requires-python = ">=3.13"
dependencies = ["shtab-core>=0.1.0", "fastapi>=0.140"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shtab_notes"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "shtab_notes/manifest.json"
"frontend" = "shtab_notes/frontend"
